@if (state.error()) {
  <p role="alert" class="status-message status-message--error">{{ state.error()?.message }}</p>
}
<ul class="trial-list" aria-label="Favorited trials">
  @for (trial of state.favorites(); track trial.nctId) {
    <li class="trial-card">
      <span class="trial-card__title">{{ trial.briefTitle }}</span>
      <button
        class="remove-button"
        (click)="state.toggleFavorite(trial)"
        [attr.aria-label]="'Remove ' + trial.briefTitle + ' from favorites'"
      >
        Remove
      </button>
    </li>
  } @empty {
    <li class="trial-card">You can view your favorited trials here.</li>
  }
</ul>
