<input type="text" (input)="searchInput($event)" placeholder="Search..." />

<input type="text" (input)="conditionInput($event)" placeholder="Search condition..." />
<select (change)="statusChange($event)">
  <option value="">Any status</option>
  @for (status of statuses; track status) {
    <option [value]="status">{{ status }}</option>
  }
</select>
<select (change)="phaseChange($event)">
  <option value="">Any phase</option>
  @for (phase of phases; track phase) {
    <option [value]="phase">{{ phase }}</option>
  }
</select>

@if (state.isLoading()) {
  <p>Loading...</p>
} @else if (state.error()) {
  <p>Something went wrong: {{ state.error()?.message }}</p>
} @else {
  <ul>
    @for (trial of state.trials(); track trial.nctId) {
      <li>{{ trial.briefTitle }}</li>
    } @empty {
      <li>No trials found.</li>
    }
  </ul>
}
